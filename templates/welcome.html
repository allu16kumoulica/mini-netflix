<!DOCTYPE html>

<html>

<head>

<title>Mini Netflix</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
}

.navbar {
    padding: 30px 60px;
}

.logo {
    color: red;
    font-size: 40px;
    font-weight: bold;
}

.hero {
    text-align: center;
    margin-top: 180px;
}

.hero h1 {
    font-size: 55px;
}

.hero p {
    font-size: 20px;
}

button {
    padding: 15px 40px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
}

.login {
    background: red;
    color: white;
    border: none;
}

.signup {
    background: white;
    color: black;
    border: none;
}

</style>

</head>


<body>


<div class="navbar">

<div class="logo">
MINI NETFLIX
</div>

</div>


<div class="hero">

<h1>
Movies, shows and more.
</h1>

<p>
Login to start watching.
</p>


<a href="/login">

<button class="login">
Login
</button>

</a>


<a href="/signup">

<button class="signup">
Sign Up
</button>

</a>


</div>


</body>

</html>
